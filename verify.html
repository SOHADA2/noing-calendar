 inner.innerHTML="\n    <div class=\"doc-title\">용  역  계  약  서</div>\n    <table class=\"overview keep\">\n      <tr><td class=\"lbl\">계약건명</td><td>애드쿠아 대행 콘텐츠 발행 외주</td></tr>\n      <tr><td class=\"lbl\">계약기간</td><td>2026년 07월 22일부터 콘텐츠 배포일까지 (작업 완료)</td></tr>\n      <tr><td class=\"lbl\">계약금액</td><td>별첨 작업내역서 참고</td></tr>\n      <tr><td class=\"lbl\">결제방법</td><td>작업 완료 확인 후, 익월 말일까지 완불 (후불)</td></tr>\n    </table>\n    <div class=\"intro\">애드쿠아(이하 '갑')와 주식회사 노잉커뮤니케이션즈(이하 '을')는 본 용역 건의 작업을 위하여 다음과 같이 계약을 체결한다.</div>\n    <div class=\"clause\"><div class=\"clause-h\">제 1조 (목적)</div><div class=\"clause-b\"><div class=\"cl-line\">'갑'이 '을'에게 의뢰한 대행 콘텐츠 제작 및 배포를 효과적으로 진행하기 위한 범위와 규정을 목적으로 한다.</div></div></div><div class=\"clause\"><div class=\"clause-h\">제 2조 (업무의 범위 및 내용)</div><div class=\"clause-b\"><div class=\"cl-line\">'을'은 '갑'의 요청에 따라 '갑'의 별첨 - 작업내역서와 같이 용역 업무를 수행한다.</div></div></div><div class=\"clause\"><div class=\"clause-h\">제 3조 (수행기간)</div><div class=\"clause-b\"><div class=\"cl-line\">본 계약의 업무 수행기간은 2026년 07월 22일부터 프로젝트가 끝나는 시점으로 한다.</div></div></div><div class=\"clause\"><div class=\"clause-h\">제 4조 (수행방법)</div><div class=\"clause-b\"><div class=\"cl-line\">'을'은 '갑'의 작업범위에 대해 다음의 내용을 수행한다.</div><div class=\"cl-line cl-1\">가. '갑'은 '을'의 콘텐츠 제작을 위한 작업에 참고할 자료를 제공한다. (단, 해당 자료가 거짓이거나, 외부 기관으로부터의 소명요청이 오는 경우, '갑'은 성실히 소명한다.)</div><div class=\"cl-line cl-1\">나. '갑'과 '을'은 대행 콘텐츠 제작이 원활하게 이루어지도록 콘텐츠에 대한 내용을 지속적으로 협의하며 진행한다.</div><div class=\"cl-line cl-1\">다. '갑'은 '을'이 제작한 콘텐츠를 배포하기 전, 해당 콘텐츠를 검수하며, '갑'의 동의 후 콘텐츠를 협의한 날짜에 업로드한다. 단, 콘텐츠 업로드 일정 변동이 불가피할 경우엔 '갑'과 '을'은 빠르게 협의를 통해서 업로드 대체 일정을 정한다.</div><div class=\"cl-line cl-1\">라. '을'은 '갑'이 콘텐츠에 대한 인사이트를 요청 시, 요청일로부터 일주일 이내에 인사이트를 캡쳐하여 전달한다.</div></div></div><div class=\"clause\"><div class=\"clause-h\">제 5조 (상호 의무)</div><div class=\"clause-b\"><div class=\"cl-line\">'을'은 '갑'에게 위탁 받은 업무를 신의와 성실을 다하여 수행하며, '갑'의 사전 승인 없이 본 계약에 따른 권리 및 의무를 제 3자에게 양도 또는 위임할 수 없다.</div></div></div><div class=\"clause\"><div class=\"clause-h\">제 6조 (비용 정산과 지급)</div><div class=\"clause-b\"><div class=\"cl-line cl-1\">가. '갑'은 제 2조에서 정한 기본 업무에 대가로서 별첨 – 작업내역서의 비용을 '을'에게 지급한다.</div><div class=\"cl-line cl-1\">나. '갑'은 완료된 작업을 검수하여 이상이 없으면 세금계산서를 수취하고 작업 완료월의 익월 말일까지 '을'의 지정된 계좌에 입금한다. 단, 협의된 일자가 별도로 있을 시 해당 입금일자를 따른다.</div><div class=\"cl-line cl-1\">다. '갑'이 나항의 지급기일까지 대금을 지급하지 아니한 경우, '갑'은 지급기일 다음 날부터 실제 지급일까지의 지연일수에 대하여 미지급 금액에 연 6%의 비율을 적용한 지연이자를 가산하여 '을'에게 지급한다.</div></div></div><div class=\"clause\"><div class=\"clause-h\">제 7조 (저작권)</div><div class=\"clause-b\"><div class=\"cl-line\">'을'이 작성한 저작물에 대한 저작권 및 기타 지적재산권은 '을'에게 귀속되며, '갑'은 '을'이 제공한 저작물을 별도의 협의되지 않은 마케팅에 사용할 수 없다.</div></div></div><div class=\"clause\"><div class=\"clause-h\">제 8조 (비밀 유지)</div><div class=\"clause-b\"><div class=\"cl-line\">'갑'과 '을'은 본 작업과 관련된 일체의 정보 및 상호 간의 정보를 외부에 누설하거나 유출해서는 아니 되며, 이로 인해 발생되는 모든 책임은 '원인제공자'에게 있다.</div></div></div><div class=\"clause\"><div class=\"clause-h\">제 9조 (계약의 중도 해지)</div><div class=\"clause-b\"><div class=\"cl-line cl-1\">가. '갑' 또는 '을'에게 다음 각 호의 사유가 발생할 경우 상대방은 서면통지로써 본 계약을 해지할 수 있다.</div><div class=\"cl-line cl-2\">① '갑' 또는 '을'이 본 계약상 의무를 위반하여 상대방이 14일 이상의 기간을 정하여 서면으로 이행을 최고하였음에도 동 기간 내에 이행하지 않는 경우</div><div class=\"cl-line cl-2\">② '을'의 비정상적인 업무수행으로 '갑'의 정상적인 업무수행을 방해한 경우</div><div class=\"cl-line cl-2\">③ '갑' 또는 '을'에게 해산, 부도, 파산 또는 회생절차의 개시 신청, 기타 이에 준하는 사유가 발생하여 본 계약을 정상적으로 이행하기 어렵다고 판단되는 경우</div><div class=\"cl-line cl-1\">나. 가.의 해지 사유에 해당하지 않는 경우에도 '갑'과 '을'은 상호 합의를 통하여 본 계약을 중도 해지할 수 있다.</div><div class=\"cl-line cl-1\">다. 중도 해지 시 '갑'은 해지일까지 '을'이 이미 수행하여 제공한 결과물에 대한 용역 비용을 '을'에게 지급하여야 하며, 이미 제공받은 결과물에 대해서는 그 대가의 반환을 요구할 수 없다. 아직 수행되지 아니한 잔여 용역에 대해서는 '갑'의 대금 지급 의무가 발생하지 아니한다.</div></div></div><div class=\"clause\"><div class=\"clause-h\">제 10조 (손해배상)</div><div class=\"clause-b\"><div class=\"cl-line\">'갑'과 '을'은 본 계약에 의한 제반 업무에 대하여 고의나 과실로 인하여 발생하는 손해에 대해 과실측이 배상책임을 진다. 다만, 본 계약과 관련하여 일방이 상대방에게 부담하는 손해배상책임의 총액은 본 계약금액(별첨 작업내역서상 총액)을 한도로 한다. 단, 고의 또는 중대한 과실로 인한 손해의 경우에는 그러하지 아니하다.</div></div></div><div class=\"clause\"><div class=\"clause-h\">제 11조 (분쟁 해결)</div><div class=\"clause-b\"><div class=\"cl-line\">본 계약과 관련하여 발생하는 분쟁은 서울중앙지방법원을 관할로 한다.</div></div></div><div class=\"clause\"><div class=\"clause-h\">제 12조 (일반 사항)</div><div class=\"clause-b\"><div class=\"cl-line\">본 계약서에 명시되지 않거나 해석상 이견이 있을 시는 관련 법령 및 일반 상관례에 따른다.</div></div></div>\n    <div class=\"clause-b keep\" style=\"margin-top:8px\">본 계약을 증명하기 위하여 계약서 2부를 작성하여 '갑'과 '을'이 서명 날인하여 각각 1부씩 보관한다.</div>\n    <div class=\"sign-date\">2026년 07월 22일</div>\n    <table class=\"parties keep\">\n      <tr>\n        <td class=\"lbl\">상호 (갑)</td><td class=\"val\">애드쿠아</td>\n        <td class=\"lbl\">상호 (을)</td><td class=\"val\">주식회사 노잉커뮤니케이션즈</td>\n      </tr>\n      <tr>\n        <td class=\"lbl\">사업자등록번호</td><td class=\"val\">211-87-25387</td>\n        <td class=\"lbl\">사업자등록번호</td><td class=\"val\">764-86-00786</td>\n      </tr>\n      <tr>\n        <td class=\"lbl\">주소</td><td class=\"val\">서울특별시 강남구 학동로 318, 1,2,3층(논현동, 유경빌딩)</td>\n        <td class=\"lbl\">주소</td><td class=\"val\">서울특별시 서대문구 수색로 43, 1층 105호</td>\n      </tr>\n      <tr>\n        <td class=\"lbl\">대표이사</td><td class=\"val\">정건영 (인)</td>\n        <td class=\"lbl\">대표이사</td><td class=\"val\">허지웅 <img class=\"seal\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=\" alt=\"\"/></td>\n      </tr>\n    </table>\n    <div class=\"page-break\"></div>\n    <div class=\"annex-title keep\">[별첨 - 작업내역서] <span style=\"font-size:9pt;font-weight:400\">(단위: 원)</span></div>\n    <table class=\"annex-info keep\">\n      <tr><td class=\"lbl\">콘텐츠명</td><td>애드쿠아 5월 콘텐츠</td>\n          <td class=\"lbl\">콘텐츠 유형</td><td>단순발행</td></tr>\n      <tr><td class=\"lbl\">발행(예정)일</td><td>2026.07.20</td>\n          <td class=\"lbl\">발행 채널</td><td>@one_home_life · guide · mag</td></tr>\n    </table>\n    <table class=\"items\">\n      <colgroup><col class=\"c1\"><col class=\"c2\"><col class=\"c3\"
